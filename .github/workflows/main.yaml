name: Build and test 

on: [push, pull_request]

jobs:
  build:
    name: Build my project ✨
    runs-on: ubuntu-latest
    permissions:
        contents: write
        checks: write
    steps:
      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # Cache
      - uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      # Test
      - name: Run tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      # Build
      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          allowDirtyBuild: true

      # Remove DoNotShip files
      - name: Remove DoNotShip files
        run: |
          sudo chmod -R u+w build/StandaloneWindows64/StandaloneWindows64_BurstDebugInformation_DoNotShip || true
          sudo rm -rf build/StandaloneWindows64/StandaloneWindows64_BurstDebugInformation_DoNotShip

      # Output
      - uses: actions/upload-artifact@v4
        with:
          name: Build
          path: build

  itchio-upload:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: Build
          path: build
      - name: Setup butler
        uses: remarkablegames/setup-butler@v2
      - name: Upload to itch.io
        run: butler push build/StandaloneWindows64/ ${{ vars.ITCH_IO_PROJECT }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}